{% assign items = site.data.contributions.selected %}
{% if include.limit %}
  {% assign items = items | slice: 0, include.limit %}
{% endif %}

<div class="contribution-grid">
  {% for item in items %}
    <a class="contribution-card" href="{{ item.url }}" target="_blank" rel="noopener noreferrer">
      <div class="contribution-card__topline">
        <span class="contribution-card__project">{{ item.project }}</span>
        <span class="status-pill status-pill--{{ item.status }}">{{ item.status_label }}</span>
      </div>
      <h3>{{ item.title }}</h3>
      <p>{{ item.impact }}</p>
      <div class="contribution-card__meta">
        <span>#{{ item.number }}</span>
        <span>{{ item.area }}</span>
      </div>
    </a>
  {% endfor %}
</div>
